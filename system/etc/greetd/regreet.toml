# macOS dark style ReGreet (matching Mac Mode)

[background]
path = "/usr/share/backgrounds/greeter.jpg"
fit = "Cover"

[GTK]
application_prefer_dark_theme = true
cursor_theme_name = "Adwaita"
font_name = "Inter 13"
icon_theme_name = "breeze-dark"
theme_name = "Adwaita"

[commands]
reboot = [ "systemctl", "reboot" ]
poweroff = [ "systemctl", "poweroff" ]

[appearance]
# install.sh replaces it with the machine's hostname
greeting_msg = "cachyos"

# install.sh replaces locale with the system date locale (localectl: "es_ES", "de_DE"...)
# and format with its translation (.config/themes/i18n/<language>.json); here, in English
[widget.clock]
format = "%A, %B %d  ·  %H:%M"
resolution = "500ms"
label_width = 320
locale = "en_US"
