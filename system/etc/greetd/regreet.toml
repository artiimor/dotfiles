# ReGreet estilo macOS oscuro (a juego con el Modo Mac)

[background]
path = "/usr/share/backgrounds/greeter.jpg"
fit = "Cover"

[GTK]
application_prefer_dark_theme = true
cursor_theme_name = "Adwaita"
font_name = "Inter 13"
icon_theme_name = "breeze-dark"
theme_name = "Adwaita"

[commands]
reboot = [ "systemctl", "reboot" ]
poweroff = [ "systemctl", "poweroff" ]

[appearance]
greeting_msg = "cachyos-x8664"

[widget.clock]
format = "%A, %d de %B  ·  %H:%M"
resolution = "500ms"
label_width = 320
locale = "es_ES"
