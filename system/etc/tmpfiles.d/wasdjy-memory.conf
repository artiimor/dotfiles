# Less RAM: transparent huge pages only for programs that ask for them (madvise).
# With the kernel default "always", every Qt/Electron program reserves 2 MB blocks it
# barely touches: a bare Quickshell goes from 31 to 99 MB. Applied at boot by
# systemd-tmpfiles ("w", not "w!": install.sh also applies it right away)
w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
