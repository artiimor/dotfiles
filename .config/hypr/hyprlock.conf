# Colores del tema activo (los genera ~/.config/themes/theme-set)
source = ~/.config/hypr/hyprlock-colors.conf
$font    = JetBrainsMono Nerd Font Propo

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = suave, 0.25, 1, 0.5, 1
    bezier = rebote, 0.34, 1.56, 0.64, 1
    bezier = lineal, 0, 0, 1, 1
    animation = fadeIn, 1, 5, suave
    animation = fadeOut, 1, 4, suave
    animation = inputFieldDots, 1, 2, rebote
    animation = inputFieldColors, 1, 4, lineal
    animation = inputFieldFade, 1, 6, suave
    animation = inputFieldWidth, 1, 4, rebote
}

# Fondo: el wallpaper desenfocado y oscurecido
background {
    monitor =
    path = ~/.config/backgrounds/wallpaper.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# Hora
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $accent
    font_size = 110
    font_family = $font Bold
    shadow_passes = 2
    shadow_size = 4
    position = 0, 260
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%A, %B %d"
    color = $muted
    font_size = 20
    font_family = $font
    shadow_passes = 2
    position = 0, 160
    halign = center
    valign = center
}

# Usuario
label {
    monitor =
    text = 󰀄  $USER
    color = $fg
    font_size = 16
    font_family = $font Bold
    position = 0, 20
    halign = center
    valign = center
}

# Contraseña
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 10
    outer_color = $accent $accent2 45deg
    inner_color = $bg
    font_color = $fg
    font_family = $font
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = true
    fade_timeout = 3000
    placeholder_text = <span foreground="##5d6088">Password...</span>
    hide_input = false
    check_color = $yellow
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    fail_transition = 300
    capslock_color = $yellow
    shadow_passes = 2
    position = 0, -50
    halign = center
    valign = center
}

# Batería
label {
    monitor =
    text = cmd[update:30000] echo "󰁹  $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = $muted
    font_size = 13
    font_family = $font Bold
    position = -30, 20
    halign = right
    valign = bottom
}
