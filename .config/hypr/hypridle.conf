general {
    # Quickshell lock screen (~/.config/quickshell/services/Lock.qml).
    # If Quickshell isn't running, hyprlock is the fallback.
    lock_cmd = qs ipc call lock lock || pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
  }

# Dim the panel (-c backlight: never an LED; with no panel, on a desktop, it does nothing)
listener {
    timeout = 150
    on-timeout = brightnessctl -c backlight -s set 10%
    on-resume = brightnessctl -c backlight -r
  }

listener {
    timeout = 300
    on-timeout = loginctl lock-session
  }

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
  }

listener {
    timeout = 900
    on-timeout = systemctl suspend
  }
