general {
    # Pantalla de bloqueo de Quickshell (~/.config/quickshell/services/Lock.qml).
    # Si Quickshell no está en marcha, hyprlock hace de reserva.
    lock_cmd = qs ipc call lock lock || pidof hyprlock || hyprlock
  }

listener {
    timeout = 300
    on-timeout = loginctl lock-session
  }
