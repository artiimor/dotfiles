general {
    # Pantalla de bloqueo de Quickshell (~/.config/quickshell/services/Lock.qml).
    # Si Quickshell no está en marcha, hyprlock hace de reserva.
    lock_cmd = qs ipc call lock lock || pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
  }

# Atenuar el panel (-c backlight: nunca un LED; sin panel, en un sobremesa, no hace nada)
listener {
    timeout = 150
    on-timeout = brightnessctl -c backlight -s set 10%
    on-resume = brightnessctl -c backlight -r
  }

listener {
    timeout = 300
    on-timeout = loginctl lock-session
  }

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
  }

listener {
    timeout = 900
    on-timeout = systemctl suspend
  }
