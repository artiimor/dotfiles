font_family                 GeistMono Nerd Font
font_size                   13.75
# Un poco más de aire entre líneas
modify_font                 cell_height 115%
background_opacity          0.85
cursor_trail                1

# Cursor fino que respira, como el del launcher de Quickshell
cursor_shape                beam
cursor_beam_thickness       1.5
cursor_blink_interval       1.0 ease-in-out
cursor_stop_blinking_after  0
window_padding_width        25

# Colores del tema activo (los genera ~/.config/themes/theme-set)
include themes/current.conf

# Copiar/pegar universal (Super+C / Super+V en Hyprland mandan estas teclas)
map ctrl+insert  copy_to_clipboard
map shift+insert paste_from_clipboard

# No pedir confirmación al cerrar
confirm_os_window_close 0
