[dmenu]
# Quickshell menu. It's called "wmenu" so networkmanager_dmenu passes it
# the prompt and hides the password (see ~/.config/quickshell/scripts/dmenu-qs)
dmenu_command = @HOME@/.config/quickshell/scripts/wmenu
highlight = True
# Active connection highlighted (turquoise on dark blue)
highlight_fg = #82dccc
highlight_bg = #182545
highlight_bold = True
compact = True
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {icon}  {name}  {sec}
list_saved = False
prompt = Wi-Fi

[dmenu_passphrase]
obscure = True

[editor]
terminal = ghostty
gui_if_available = False

[nmdm]
rescan_delay = 5
notification_timeout = 5
show_notifications = True
