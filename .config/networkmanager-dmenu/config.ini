[dmenu]
# Posición: reglas de wofi en hypr/config/windowrules.lua
# Menú de Quickshell. Se llama "wmenu" para que networkmanager_dmenu le pase
# el prompt y oculte la contraseña (ver ~/.config/quickshell/scripts/dmenu-qs)
dmenu_command = /home/morci/.config/quickshell/scripts/wmenu
highlight = True
# Conexión activa con la paleta CachyOS de wofi (lgreen sobre surface)
highlight_fg = #82dccc
highlight_bg = #182545
highlight_bold = True
compact = True
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {icon}  {name}  {sec}
list_saved = False
prompt = Wi-Fi

[dmenu_passphrase]
obscure = True

[editor]
terminal = kitty
gui_if_available = False

[nmdm]
rescan_delay = 5
notification_timeout = 5
show_notifications = True
